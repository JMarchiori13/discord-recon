[package]
name = "discord-recon"
version = "0.2.0"
edition = "2021"
description = "Discord OSINT reconnaissance CLI — read-only, public/authorized API surfaces only"
license = "MIT"
repository = "https://github.com/JMarchiori13/discord-recon"
homepage = "https://github.com/JMarchiori13/discord-recon"
readme = "README.md"
keywords = ["osint", "recon", "discord", "security", "reconnaissance"]
categories = ["command-line-utilities", "os"]
exclude = ["docs/assets/", ".github/"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
